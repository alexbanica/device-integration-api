openapi: 3.0.3
info:
  title: Device Integration API
  version: 1.0.0
  description: API for controlling Raspberry Pi connected devices.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/health:
    get:
      summary: Application health
      responses:
        '200':
          description: Application is healthy
        '503':
          description: Dependency is down
  /api/v1/fan/state:
    get:
      summary: Get fan state
      responses:
        '200':
          description: Current fan state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanState'
  /api/v1/fan/start:
    post:
      summary: Start fan
      responses:
        '202':
          description: Command accepted
        '500':
          description: Command failed
  /api/v1/fan/reset:
    post:
      summary: Reset fan to default state
      responses:
        '202':
          description: Command accepted
        '500':
          description: Command failed
  /api/v1/fan/stop:
    post:
      summary: Stop fan
      responses:
        '202':
          description: Command accepted
        '500':
          description: Command failed
  /api/v1/fan/rotate:
    post:
      summary: Toggle fan rotation
      responses:
        '202':
          description: Command accepted
        '500':
          description: Command failed
  /api/v1/fan/speed/{speed}:
    put:
      summary: Set fan speed
      parameters:
        - name: speed
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 3
      responses:
        '202':
          description: Command accepted
        '400':
          description: Invalid speed parameter
        '500':
          description: Command failed
  /api/v1/shades/backyard/up:
    post:
      summary: Send backyard shade up command (close)
      description: Available only when SHADE_ENABLED is true. No payload is used. Acknowledges transmitter execution, without position or physical movement confirmation. Failed commands may already have emitted RF and are never retried automatically.
      responses:
        '202':
          description: Transmitter command completed; empty response
        '409':
          description: Another shade command is running or cleanup is uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Command failed, timed out, or could not be safely cleaned up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shades/backyard/down:
    post:
      summary: Send backyard shade down command (open)
      description: Available only when SHADE_ENABLED is true. No payload is used. Acknowledges transmitter execution, without position or physical movement confirmation. Failed commands may already have emitted RF and are never retried automatically.
      responses:
        '202':
          description: Transmitter command completed; empty response
        '409':
          description: Another shade command is running or cleanup is uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Command failed, timed out, or could not be safely cleaned up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shades/backyard/my:
    post:
      summary: Send backyard shade my command (stop)
      description: Available only when SHADE_ENABLED is true. No payload is used. Acknowledges transmitter execution, without position or physical movement confirmation. Failed commands may already have emitted RF and are never retried automatically.
      responses:
        '202':
          description: Transmitter command completed; empty response
        '409':
          description: Another shade command is running or cleanup is uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Command failed, timed out, or could not be safely cleaned up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required: [message, timestamp]
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    FanState:
      type: object
      required:
        - isOn
        - speed
        - isRotating
      properties:
        isOn:
          type: boolean
        speed:
          type: integer
          minimum: 0
          maximum: 3
        isRotating:
          type: boolean
